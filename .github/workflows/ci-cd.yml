name: ci-cd

on:
  push:
    branches: [main]

jobs:
  build-test-push-hf:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          python -m flake8 .

      - name: Tests (pytest)
        run: |
          pytest -v

      - name: Docker login
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != '' }}
        run: |
          echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Docker build
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != '' }}
        run: |
          IMAGE="$DOCKER_USERNAME/noshow-iq-23769:latest"
          docker build -t "$IMAGE" .

      - name: Docker push
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != '' }}
        run: |
          IMAGE="$DOCKER_USERNAME/noshow-iq-23769:latest"
          docker push "$IMAGE"

      - name: Trigger Hugging Face Space rebuild
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          # HF space to restart (Docker runtime)
          repo_id = "raja2001/noshow-iq-23769"
          token = os.environ["HF_TOKEN"].strip()
          api = HfApi(token=token)
          api.restart_space(repo_id=repo_id)
          print("Restart requested for", repo_id)
          PY

