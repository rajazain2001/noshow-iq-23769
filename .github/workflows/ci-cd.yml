name: ci-cd

on:
  push:
    branches: [main]

jobs:
  build-test-push-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          python -m flake8 .

      - name: Tests (pytest)
        run: |
          pytest -v

      - name: Docker login
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker build
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/noshow-iq-23769:latest"
          docker build -t "$IMAGE" .

      - name: Docker push
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/noshow-iq-23769:latest"
          docker push "$IMAGE"

      - name: Trigger Hugging Face Space rebuild
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          # HF space to restart (Docker runtime)
          repo_id = "raja2001/noshow-iq-23769"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.restart_space(repo_id=repo_id)
          print("Restart requested for", repo_id)
          PY

