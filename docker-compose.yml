services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Default to local compose Mongo. Override by setting MONGO_URI in `.env` (gitignored)
      # or via deployment secrets (GitHub Actions / Hugging Face Spaces).
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb

volumes:
  mongo_data:

